name: xDrip Manual Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build xDrip APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build xDrip Release APK
      run: ./gradlew assembleRelease -x lint -x test --stacktrace --no-daemon

    - name: Check expected APK output
      run: bash ./etc/CheckBuild/check-release.sh test

    - name: Sign Release APK
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v7
      with:
        name: xDrip-Signed-Release-APK
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        if-no-files-found: error
