name: xDrip Manual Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build xDrip APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build xDrip Release APK
      run: ./gradlew --no-daemon --stacktrace :app:assembleProdRelease

    - name: List APK outputs
      run: find app/build/outputs/apk -type f -name "*.apk" -print

    - name: Check expected APK output
      run: bash ./etc/CheckBuild/check-release.sh test

    - name: Sign app release APK
      id: sign_app
      uses: ilharp/sign-android-release@v2
      with:
        releaseDir: app/build/outputs/apk/prod/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
        buildToolsVersion: 35.0.0

    - name: Rename signed APK
      id: rename_apk
      run: |
        APK_NAME=xDrip_$(date +'%d-%m-%Y')
        APK_PATH=dist/${APK_NAME}.apk
        mkdir -p dist
        cp "${{ steps.sign_app.outputs.signedFile }}" ${APK_PATH}
        echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
        echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.rename_apk.outputs.apk_name }}
        path: ${{ steps.rename_apk.outputs.apk_path }}
        if-no-files-found: error
